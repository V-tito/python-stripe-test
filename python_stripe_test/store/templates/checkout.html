<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm payment</title>
    <script {% csp_nonce_attr %} src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <form id="payment-form" data-secret="{{ client_secret }}">
      <div id="payment-element">
        <!-- Elements will create form elements here -->
      </div>
      <button id="submit">Confirm payment</button>
    </form>
    <script nonce="{{ csp_nonce }}">
      (function () {
        var stripe = Stripe("{{ pub_key }}");
        const elements = stripe.elements(options);
        const options = {
          clientSecret: "{{client_secret}}",
        };
        // Create and mount the Payment Element
        const paymentElementOptions = { layout: "accordion" };
        const paymentElement = elements.create(
          "payment",
          paymentElementOptions,
        );
        paymentElement.mount("#payment-element");

        var paymentForm = document.addEventListener("submit", async (event) => {
          event.preventDefault();
          console.log("started processing");
          const { error } = await stripe.confirmPayment({
            //`Elements` instance that was used to create the Payment Element
            elements,
            confirmParams: {
              return_url: "paymentSuccess/",
            },
          });
          console.log(error);
          if (error) {
            window.location.href = "paymentError/";
          } else {
            if (result.paymentIntent.status === "succeeded") {
              window.location.href = "paymentSuccess/";
            }
          }
        });
      });
    </script>
  </body>
</html>
